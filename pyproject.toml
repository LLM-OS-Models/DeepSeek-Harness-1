[project]
authors = [
    { name = "harness-1-local", email = "local@local" },
]
name = "harness-1-local"
version = "0.2.0"
description = "Harness-1 refactored for local RL (DeepSeek-V4-Flash FP8 + LoRA + verl/TRL). Tinker-free."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.72.0",
    "chromadb==1.4.0",
    "datasets>=4.3.0",
    "fastembed>=0.7.3",
    "onnxruntime==1.21.0",
    "openai>=2.6.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.6.1",
    "pysqlite3-binary>=0.5.4",
    "tokenizers>=0.22.1",
    "transformers>=5.14,<6",
    "peft>=0.20.0",
    "accelerate>=1.6.0",
    "trl>=1.9.0",
    # torch / torchvision / torchaudio are pinned to the +cu128 local version
    # via [tool.uv.sources] below. Driver 570.86.10 = CUDA 12.9 only; the cu130
    # wheels (PyPI default for 2.11.0) demand CUDA 13 and fail at first kernel.
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "torchaudio==2.11.0+cu128",
    "structlog>=25.5.0",
    "rich>=14.2.0",
    "tenacity>=9.1.2",
    "baseten-performance-client>=0.0.12",
    "tiktoken>=0.12.0",
    "chz>=0.4.0",
    "langchain-text-splitters>=1.1.0",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.8",
    "json-repair>=0.55.0",
    "wandb>=0.25.1",
    "modal>=1.0.0",
    "wikipedia-api>=0.14.1",
]

[project.optional-dependencies]
dev = ["mypy>=1.18.2", "pytest>=8.3.3", "ruff>=0.14.3"]

# NOTE: RL extras (verl, vllm, deepspeed, ray) are intentionally NOT listed
# here. vllm ships CUDA-specific wheels and the PyPI default is cu130 (driver
# too old). Install after `uv sync` with the cu129 wheel from GitHub:
#
#   uv pip install --no-deps verl==0.8.0 deepspeed==0.19.3 "ray[default]==2.56.1"
#   uv pip install --no-deps \
#       https://github.com/vllm-project/vllm/releases/download/v0.25.0/vllm-0.25.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl
#   uv pip install -r requirements.rl.runtime.txt
#
# See docs/training_guide.md §1 for the full setup recipe.

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "datagen", "inference", "training_local"]

[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "verl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vllm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "peft.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ray.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepspeed.*"
ignore_missing_imports = true
