[project]
authors = [
    { name = "harness-1-local", email = "local@local" },
]
name = "harness-1-local"
version = "0.2.0"
description = "Harness-1 refactored for local RL (DeepSeek-V4-Flash FP8 + LoRA + verl/TRL). Tinker-free."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.72.0",
    "chromadb==1.4.0",
    "datasets>=4.3.0",
    "fastembed>=0.7.3",
    "onnxruntime==1.21.0",
    "openai>=2.6.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.6.1",
    "pysqlite3-binary>=0.5.4",
    "tokenizers>=0.22.1",
    "transformers>=4.56.0",
    "peft>=0.18.0",
    "accelerate>=1.6.0",
    "trl>=0.24.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "nvidia-nccl-cu12==2.29.7",
    "structlog>=25.5.0",
    "rich>=14.2.0",
    "tenacity>=9.1.2",
    "baseten-performance-client>=0.0.12",
    "tiktoken>=0.12.0",
    "chz>=0.4.0",
    "langchain-text-splitters>=1.1.0",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.8",
    "json-repair>=0.55.0",
    "wandb>=0.25.1",
    "modal>=1.0.0",
    "wikipedia-api>=0.14.1",
]

[project.optional-dependencies]
dev = ["mypy>=1.18.2", "pytest>=8.3.3", "ruff>=0.14.3"]

# NOTE: RL extras (verl, vllm, deepspeed, ray) are intentionally NOT listed
# here. They disagree with the base deps on torch/torchvision and numpy
# major versions, so `uv lock` cannot resolve them together. Install after
# `uv sync` with --no-deps to avoid downgrading torch:
#
#   uv pip install --no-deps verl==0.8.0 vllm==0.14.0 deepspeed "ray[default]"
#   uv pip install pyarrow tensordict tensorboardX \
#       codetiming pylatexenc dill pybind11
#
# See docs/training_guide.md §1 for the full setup recipe.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "datagen", "inference", "training_local"]

[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "verl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vllm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "peft.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ray.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepspeed.*"
ignore_missing_imports = true
